<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Net Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a1c; --line:#2b3a26; --panel:#fffcf2; --soft:#f3ecd8;
  --accent:#ff7a3d; --gem:#2f9fe8; --good:#2f9e63; --bad:#d9454b; --gold:#e8a317;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#86c965;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
button{font:inherit;color:inherit}
.px{font-family:'Pixelify Sans','Atkinson Hyperlegible',sans-serif}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:10px 12px;pointer-events:none;flex-wrap:wrap}
.hud-group{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.chip{pointer-events:auto;background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:5px 10px;font-weight:700;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.lv{background:var(--accent);color:#fff}
.month{flex-direction:column;align-items:stretch;gap:3px;padding:4px 10px;min-width:170px}
.month .row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar{height:9px;background:var(--soft);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);width:0;transition:width .4s}
.nets span{padding:1px 6px;border-radius:7px}
.nets span.on{background:#ffe6a8;outline:2px solid var(--line)}
.badge{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;line-height:18px}

@media (max-width:640px){
  #hud{padding:8px;gap:6px}
  .hud-group{gap:6px}
  .chip{font-size:13px;padding:4px 8px;border-width:2px;box-shadow:0 2px 0 var(--line)}
  .month{min-width:150px}
}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 3px 0 var(--line);z-index:5}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Touch controls */
.dpad{position:fixed;left:18px;bottom:18px;width:150px;height:150px;z-index:3}
.dpad button,.abtn{position:absolute;width:52px;height:52px;border-radius:14px;border:3px solid var(--line);background:rgba(255,252,242,.85);font-size:22px;box-shadow:0 3px 0 var(--line);touch-action:none}
.dpad .u{left:49px;top:0}.dpad .d{left:49px;bottom:0}.dpad .l{left:0;top:49px}.dpad .r{right:0;top:49px}
.abtn{position:fixed;right:24px;bottom:40px;width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:20px;z-index:3}
#toast{bottom:190px}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(20,30,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal[hidden]{display:none}
.card{background:var(--panel);border:4px solid var(--line);border-radius:18px;box-shadow:0 6px 0 var(--line);padding:20px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;animation:pop .25s ease-out;user-select:text;-webkit-user-select:text}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:'Pixelify Sans',sans-serif;margin:0 0 8px;font-size:28px;line-height:1.1}
.card p{margin:8px 0;line-height:1.45}
.big{font-size:72px;line-height:1;text-align:center;margin:6px 0}
.center{text-align:center}
.btn{cursor:pointer;border:3px solid var(--line);border-radius:12px;padding:9px 16px;font-weight:700;background:#fff;box-shadow:0 3px 0 var(--line);font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.small{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.robot{display:flex;gap:12px;align-items:flex-start;background:#e6f3ff;border:3px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.robot .face{font-size:42px;line-height:1}
.task{background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;font-size:18px}
.task .what{font-weight:700;font-size:20px}
.due{font-weight:700}
.due.soon{color:var(--bad)}
.row-item{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
.row-item .em{font-size:40px;line-height:1}
.row-item .body{flex:1;min-width:0}
.row-item .t{font-weight:700}
.sub{font-size:14px;opacity:.8}
.pbar{height:12px;background:var(--soft);border:2px solid var(--line);border-radius:7px;overflow:hidden;margin:5px 0}
.pbar>i{display:block;height:100%;background:var(--gem)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.cell{background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.cell .e{font-size:38px;line-height:1.1}
.cell .e.unknown{filter:brightness(0);opacity:.25}
.cell .n{font-weight:700;font-size:13px}
.cell .c{font-size:12px;opacity:.75}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:1px 6px}
.shop-item{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.shop-item .em{font-size:44px}
.shop-item .body{flex:1}
input[type=text],input[type=password],input[type=tel]{font:inherit;border:3px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;background:#fff}
.pin{letter-spacing:10px;text-align:center;font-size:26px;max-width:200px;margin:8px auto;display:block}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.section{margin-top:18px}
.section h3{margin:0 0 6px;font-size:17px}
.list-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dashed var(--soft)}
label.toggle{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
label.toggle input{width:20px;height:20px}

/* Battle */
.arena{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.fighter{text-align:center;width:42%}
.fighter .e{font-size:64px;line-height:1.1;transition:transform .15s}
.fighter .e.hit{transform:translateX(10px) rotate(12deg);filter:drop-shadow(0 0 6px #ff4d4d)}
.hearts{font-size:22px;letter-spacing:2px}
.vs{font-family:'Pixelify Sans';font-size:26px}
.tbar{position:relative;height:38px;background:#ffe1d3;border:3px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0 6px}
.tbar .zone{position:absolute;top:0;bottom:0;background:#7bd88f;border-left:3px solid var(--line);border-right:3px solid var(--line)}
.tbar .mark{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--ink);border-radius:4px}
.bmsg{text-align:center;font-weight:700;min-height:24px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-group">
    <div class="chip lv px" id="hudLevel">Lv 1</div>
    <div class="chip month">
      <div class="row"><span id="hudMonth">🐾 0 / 10 this month</span><span id="hudDays">30 days left</span></div>
      <div class="bar"><i id="hudBar"></i></div>
    </div>
    <div class="chip" title="Gems">💎 <span id="hudGems">0</span></div>
    <button class="chip nets" id="hudNets" title="Tap to choose which net to throw"><span id="netBasic">🥅 0</span><span id="netGold">✨ 0</span></button>
  </div>
  <div class="hud-group">
    <button class="chip" id="btnTasks">📋 Tasks <span class="badge" id="hudTaskCount" hidden>0</span></button>
    <button class="chip" id="btnBook">📖 Animals</button>
    <button class="chip" id="btnParents">🔒 Parents</button>
    <button class="chip" id="btnSound" title="Sound on/off">🔊</button>
  </div>
</div>

<div id="toast"></div>

<div id="touch">
  <div class="dpad">
    <button class="u" data-dir="up">▲</button>
    <button class="l" data-dir="left">◀</button>
    <button class="r" data-dir="right">▶</button>
    <button class="d" data-dir="down">▼</button>
  </div>
  <button class="abtn" id="abtn">A</button>
</div>

<div id="modal" hidden><div class="card" id="card"></div></div>

<script>
'use strict';
/* ============================================================
   Net Quest
   Throw a net at an animal → the robot gives you a task with a
   due date → finish it in time to catch the animal.
   Catch 10 animals in a month to level up.
   ============================================================ */

const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const TIME_OFFSET = (parseFloat(qs.get('dayOffset')) || 0) * 86400000; // testing aid
const now = () => Date.now() + TIME_OFFSET;
const DAY = 86400000;
const MONTH_DAYS = 30;
const GOAL = 10;
const MAX_NETTED = 5;
const NET_PRICE = 3, GOLD_PRICE = 8;
const SAVE_KEY = 'net-quest-v1';

/* ---------- Animals ---------- */
const SPECIES = [
  {id:'bunny',    e:'🐰', name:'Bunny',     r:1, lv:1},
  {id:'squirrel', e:'🐿️', name:'Squirrel',  r:1, lv:1},
  {id:'frog',     e:'🐸', name:'Frog',      r:1, lv:1},
  {id:'duck',     e:'🦆', name:'Duck',      r:1, lv:1},
  {id:'mouse',    e:'🐭', name:'Mouse',     r:1, lv:1},
  {id:'hedgehog', e:'🦔', name:'Hedgehog',  r:2, lv:1},
  {id:'fox',      e:'🦊', name:'Fox',       r:2, lv:1},
  {id:'turtle',   e:'🐢', name:'Turtle',    r:2, lv:1},
  {id:'raccoon',  e:'🦝', name:'Raccoon',   r:2, lv:2},
  {id:'owl',      e:'🦉', name:'Owl',       r:2, lv:2},
  {id:'deer',     e:'🦌', name:'Deer',      r:3, lv:2},
  {id:'beaver',   e:'🦫', name:'Beaver',    r:3, lv:2},
  {id:'bear',     e:'🐻', name:'Bear',      r:3, lv:3},
  {id:'wolf',     e:'🐺', name:'Wolf',      r:3, lv:3},
  {id:'flamingo', e:'🦩', name:'Flamingo',  r:3, lv:3},
  {id:'lion',     e:'🦁', name:'Lion',      r:4, lv:4},
  {id:'tiger',    e:'🐯', name:'Tiger',     r:4, lv:4},
  {id:'giraffe',  e:'🦒', name:'Giraffe',   r:4, lv:4},
  {id:'elephant', e:'🐘', name:'Elephant',  r:4, lv:4},
  {id:'panda',    e:'🐼', name:'Panda',     r:4, lv:5},
  {id:'unicorn',  e:'🦄', name:'Unicorn',   r:4, lv:5},
  {id:'dragon',   e:'🐉', name:'Dragon',    r:4, lv:5},
];
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));
const RARITY = ['', 'Common', 'Uncommon', 'Rare', 'Super rare'];
const RCOLOR = ['', '#5f8a52', '#2f7fc4', '#8b4fd6', '#d98a00'];
const RWEIGHT = [0, 50, 30, 15, 5];

const DEFAULT_REAL = [
  'Clean the table', 'Make your bed', 'Read a book for 15 minutes', 'Put your toys away',
  'Brush your teeth', 'Help set the table', 'Put dirty clothes in the hamper',
  'Water a plant', 'Practice writing for 10 minutes', 'Help clean up after dinner'
];

/* ---------- Save ---------- */
function freshState() {
  return {
    v: 1, gems: 5, nets: 3, gold: 0, useGold: false,
    level: 1, monthStart: now(), monthCaught: 0, totalCaught: 0,
    caught: [], netted: [], wild: [], lastSpawnDay: null, lastTrickle: now(),
    trainerReady: {}, chickenReady: {},
    settings: { real: true, realList: DEFAULT_REAL.slice() },
    pin: null, muted: false, nextId: 1, introSeen: false
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { S = null; }
if (!S || S.v !== 1) S = freshState();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Dates ---------- */
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function endOfDay(t, addDays) { const d = new Date(t); d.setHours(23, 59, 59, 999); d.setDate(d.getDate() + addDays); return d.getTime(); }
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
function dueText(t) {
  const today = endOfDay(now(), 0);
  if (t <= today) return 'Due today!';
  if (t <= endOfDay(now(), 1)) return 'Due tomorrow (' + fmtDate(t) + ')';
  return 'Due ' + fmtDate(t);
}
const daysLeft = () => Math.max(0, Math.ceil((S.monthStart + MONTH_DAYS * DAY - now()) / DAY));

/* ---------- Sound ---------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freqs, dur, type = 'sine', vol = 0.18, when = 0) {
  if (S.muted) return; const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freqs[0], t0);
  for (let i = 1; i < freqs.length; i++) o.frequency.exponentialRampToValueAtTime(freqs[i], t0 + dur * i / (freqs.length - 1));
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  boing() { tone([110, 520, 180, 380, 240], 0.55, 'sine', 0.3); },
  gem() { tone([880, 1320], 0.12, 'triangle', 0.15); tone([1320, 1760], 0.12, 'triangle', 0.12, 0.08); },
  throw() { tone([300, 700], 0.18, 'triangle', 0.1); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone([f, f], 0.18, 'square', 0.08, i * 0.11)); },
  levelup() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone([f, f], 0.16, 'square', 0.08, i * 0.1)); },
  hit() { tone([220, 90], 0.15, 'square', 0.12); },
  miss() { tone([200, 120], 0.25, 'sawtooth', 0.08); },
  sad() { tone([400, 200], 0.5, 'triangle', 0.12); },
  cluck() { tone([700, 500], 0.08, 'square', 0.07); tone([800, 550], 0.08, 'square', 0.07, 0.1); },
  click() { tone([600, 600], 0.04, 'square', 0.05); }
};

/* ---------- World ---------- */
const T = 48, MW = 40, MH = 28;
const GRASS = 0, PATH = 1, TREE = 2, WATER = 3, WALL = 4, FLOWER = 5;
const map = new Uint8Array(MW * MH);
const flowerColor = {};
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const STORE = { x: 5, y: 3, w: 6, h: 4 }, DOOR = { x: 8, y: 6 };
const COOP = { x: 19, y: 4, w: 9, h: 6 };
const START = { x: 8, y: 9 };
const TRAINERS = [
  { id: 'sam', name: 'Sam', e: '👦', x: 15, y: 10, lv: 1 },
  { id: 'mia', name: 'Mia', e: '👧', x: 33, y: 8, lv: 2 },
  { id: 'leo', name: 'Leo', e: '🧑', x: 12, y: 21, lv: 3 },
  { id: 'ana', name: 'Coach Ana', e: '👩', x: 23, y: 24, lv: 4 },
];
const tileAt = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? TREE : map[y * MW + x];
const setTile = (x, y, v) => { map[y * MW + x] = v; };
const passableTile = v => v === GRASS || v === PATH || v === FLOWER;
function genMap() {
  const R = rng(20261019);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    setTile(x, y, (x < 2 || y < 2 || x >= MW - 2 || y >= MH - 2) ? TREE : GRASS);
  }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (((x - 29) / 5.5) ** 2 + ((y - 20) / 3.2) ** 2 < 1) setTile(x, y, WATER);
  }
  for (let y = STORE.y; y < STORE.y + STORE.h; y++) for (let x = STORE.x; x < STORE.x + STORE.w; x++) setTile(x, y, WALL);
  for (let y = 7; y <= 14; y++) setTile(8, y, PATH);
  for (let x = 3; x <= 36; x++) setTile(x, 14, PATH);
  for (let y = 14; y <= 25; y++) setTile(20, y, PATH);
  for (let y = 7; y <= 14; y++) setTile(23, y, PATH);
  const blocked = (x, y) =>
    (x >= STORE.x - 2 && x <= STORE.x + STORE.w + 1 && y >= STORE.y - 1 && y <= STORE.y + STORE.h + 3) ||
    (x >= COOP.x - 1 && x <= COOP.x + COOP.w && y >= COOP.y - 1 && y <= COOP.y + COOP.h) ||
    TRAINERS.some(t => Math.abs(t.x - x) <= 1 && Math.abs(t.y - y) <= 1) ||
    (Math.abs(x - START.x) <= 2 && Math.abs(y - START.y) <= 2);
  for (let i = 0; i < 90; i++) {
    const x = 2 + Math.floor(R() * (MW - 4)), y = 2 + Math.floor(R() * (MH - 4));
    if (tileAt(x, y) === GRASS && !blocked(x, y)) setTile(x, y, TREE);
  }
  const cols = ['#ff6fa5', '#ffd23f', '#ffffff', '#b28dff', '#ff8c42'];
  for (let i = 0; i < 70; i++) {
    const x = 2 + Math.floor(R() * (MW - 4)), y = 2 + Math.floor(R() * (MH - 4));
    if (tileAt(x, y) === GRASS) { setTile(x, y, FLOWER); flowerColor[y * MW + x] = cols[Math.floor(R() * cols.length)]; }
  }
}
genMap();

function passablePx(x, y, r) {
  return passableTile(tileAt(Math.floor((x - r) / T), Math.floor((y - r) / T))) &&
         passableTile(tileAt(Math.floor((x + r) / T), Math.floor((y - r) / T))) &&
         passableTile(tileAt(Math.floor((x - r) / T), Math.floor((y + r) / T))) &&
         passableTile(tileAt(Math.floor((x + r) / T), Math.floor((y + r) / T)));
}
function randomOpenSpot(minDistFromPlayer, zone) {
  for (let i = 0; i < 400; i++) {
    const tx = zone ? zone.x + Math.floor(Math.random() * zone.w) : 2 + Math.floor(Math.random() * (MW - 4));
    const ty = zone ? zone.y + Math.floor(Math.random() * zone.h) : 2 + Math.floor(Math.random() * (MH - 4));
    const v = tileAt(tx, ty);
    if (v !== GRASS && v !== FLOWER) continue;
    if (!zone && tx >= COOP.x && tx < COOP.x + COOP.w && ty >= COOP.y && ty < COOP.y + COOP.h) continue;
    const x = tx * T + T / 2, y = ty * T + T / 2;
    if (minDistFromPlayer && Math.hypot(x - player.x, y - player.y) < minDistFromPlayer) continue;
    return { x, y };
  }
  return { x: START.x * T + T / 2, y: START.y * T + T / 2 };
}

/* ---------- Entities ---------- */
const player = { x: START.x * T + T / 2, y: START.y * T + T / 2, r: 13, face: 1, bob: 0 };
let animals = [];   // live wild animals on the map {uid, sp, x, y, vx, vy, timer}
let chickens = [];
let gems = [];
let floats = [];    // floating texts
let anim = null;    // net throw animation
let gemTimer = 0;
const inZone = (x, y, z) => !z || (x > z.x * T + 10 && x < (z.x + z.w) * T - 10 && y > z.y * T + 10 && y < (z.y + z.h) * T - 10);

function spawnWildEntity(w) {
  const p = randomOpenSpot(T * 4);
  animals.push({ uid: w.uid, sp: w.sp, x: p.x, y: p.y, vx: 0, vy: 0, timer: Math.random() * 2, hop: Math.random() * 6 });
}
function pickSpecies() {
  const pool = SPECIES.filter(s => s.lv <= S.level);
  let total = pool.reduce((a, s) => a + RWEIGHT[s.r], 0), r = Math.random() * total;
  for (const s of pool) { r -= RWEIGHT[s.r]; if (r <= 0) return s; }
  return pool[0];
}
function addWild(n) {
  for (let i = 0; i < n; i++) {
    if (S.wild.length >= 8) break;
    const w = { uid: S.nextId++, sp: pickSpecies().id };
    S.wild.push(w); spawnWildEntity(w);
  }
}
function wildArrivals() {
  const k = dayKey(now());
  if (S.lastSpawnDay !== k) {
    const first = S.lastSpawnDay === null;
    S.lastSpawnDay = k;
    addWild(first ? 5 : 4);
    if (!first) toast('🌅 New day! New animals came to the meadow.');
    S.lastTrickle = now(); save();
  }
  // a new animal wanders in every 10 minutes while the meadow is quiet
  if (S.wild.length < 3 && now() - S.lastTrickle > 10 * 60000) {
    S.lastTrickle = now(); addWild(1); save();
    toast('👀 A new animal wandered into the meadow!');
  }
}
function initEntities() {
  animals = []; S.wild.forEach(spawnWildEntity);
  chickens = [0, 1, 2].map(i => { const p = randomOpenSpot(0, COOP); return { i, x: p.x, y: p.y, vx: 0, vy: 0, timer: 0 }; });
  gems = []; for (let i = 0; i < 6; i++) spawnGem();
}
function spawnGem() { const p = randomOpenSpot(T * 3); gems.push({ x: p.x, y: p.y, t: Math.random() * 6 }); }

function wander(a, dt, speed, zone) {
  a.timer -= dt;
  if (a.timer <= 0) {
    a.timer = 1 + Math.random() * 2.5;
    const ang = Math.random() * Math.PI * 2, moving = Math.random() < 0.65;
    a.vx = moving ? Math.cos(ang) * speed : 0; a.vy = moving ? Math.sin(ang) * speed : 0;
  }
  const nx = a.x + a.vx * dt, ny = a.y + a.vy * dt;
  if (passablePx(nx, a.y, 14) && inZone(nx, a.y, zone)) a.x = nx; else a.vx *= -1;
  if (passablePx(a.x, ny, 14) && inZone(a.x, ny, zone)) a.y = ny; else a.vy *= -1;
}

/* ---------- Tasks (made by the robot) ---------- */
function makeTask(sp, golden) {
  const r = sp.r;
  let kind;
  const realOn = S.settings.real && S.settings.realList.length > 0;
  const roll = Math.random();
  if (realOn && roll < 0.3) kind = 'real';
  else kind = ['gems', 'gems', 'battles', 'eggs'][Math.floor(Math.random() * 4)];
  let target = 1, text = '';
  if (kind === 'gems') target = [0, 4, 6, 8, 10][r];
  if (kind === 'battles') target = [0, 1, 2, 3, 5][r];
  if (kind === 'eggs') target = [0, 2, 3, 4, 6][r];
  if (kind === 'real') text = S.settings.realList[Math.floor(Math.random() * S.settings.realList.length)];
  if (golden && kind !== 'real') target = Math.max(1, Math.ceil(target * 0.6));
  const days = Math.min(4, r) + (golden ? 2 : 0);
  return { kind, target, progress: 0, text, due: endOfDay(now(), days), status: 'todo', doneAt: null };
}
function taskLine(t) {
  if (t.kind === 'gems') return `💎 Find ${t.target} gem${t.target > 1 ? 's' : ''}`;
  if (t.kind === 'battles') return `⚔️ Win ${t.target} battle${t.target > 1 ? 's' : ''}`;
  if (t.kind === 'eggs') return `🐔 Get ${t.target} gem egg${t.target > 1 ? 's' : ''} from the chickens`;
  return `🏠 ${t.text}`;
}
function addProgress(kind, n = 1) {
  let finished = [];
  for (const it of S.netted) {
    if (it.task.kind !== kind) continue;
    it.task.progress = Math.min(it.task.target, it.task.progress + n);
    if (it.task.progress >= it.task.target) finished.push(it);
  }
  finished.forEach(catchAnimal);
  updateHud(); save();
}
function catchAnimal(it, byParent) {
  const i = S.netted.indexOf(it); if (i < 0) return;
  S.netted.splice(i, 1);
  S.caught.push({ sp: it.sp, at: now() });
  S.monthCaught++; S.totalCaught++;
  const bonus = it.task.kind === 'real' ? 5 : 1;
  S.gems += bonus;
  save(); updateHud();
  const sp = SP[it.sp];
  showModal(card => {
    sfx.win();
    card.innerHTML = `
      <h2 class="center">Gotcha!</h2>
      <div class="big">${sp.e}</div>
      <p class="center">You caught a <b>${sp.name}</b>!${byParent ? ' A grown-up checked in your task.' : ''}</p>
      <p class="center">🐾 <b>${Math.min(S.monthCaught, GOAL)} / ${GOAL}</b> this month &nbsp;·&nbsp; +${bonus} 💎</p>
      <div class="actions"><button class="btn primary" data-close>Yay!</button></div>`;
  });
  if (S.monthCaught >= GOAL) levelUp();
}
function levelUp() {
  S.level++; S.monthStart = now(); S.monthCaught = 0;
  S.gems += 5; S.gold += 1;
  const fresh = SPECIES.filter(s => s.lv === S.level);
  save(); updateHud();
  showModal(card => {
    sfx.levelup();
    card.innerHTML = `
      <h2 class="center">LEVEL UP!</h2>
      <div class="big px" style="color:var(--accent)">Lv ${S.level}</div>
      <p class="center">You caught ${GOAL} animals this month. Amazing!</p>
      ${fresh.length ? `<p class="center">New animals can show up now:<br><span style="font-size:40px">${fresh.map(s => s.e).join(' ')}</span></p>` : '<p class="center">You have unlocked every animal. Can you catch them all?</p>'}
      <p class="center">Prize: +5 💎 and a ✨ Golden Net</p>
      <p class="center sub">A new month starts now. Catch ${GOAL} more to reach level ${S.level + 1}!</p>
      <div class="actions"><button class="btn primary" data-close>Let's go!</button></div>`;
  });
}

/* ---------- Timers: due dates, month ---------- */
function checkTimers() {
  const t = now();
  for (const it of S.netted.slice()) {
    if (t > it.task.due && it.task.status !== 'waiting') {
      S.netted.splice(S.netted.indexOf(it), 1);
      const sp = SP[it.sp];
      sfx.sad();
      showModal(card => {
        card.innerHTML = `
          <h2 class="center">Oh no!</h2>
          <div class="big">${sp.e}💨</div>
          <p class="center">The task wasn't done by the due date, so the <b>${sp.name}</b> wriggled out of the net and ran away.</p>
          <p class="center sub">The task was: ${esc(taskLine(it.task))}</p>
          <div class="actions"><button class="btn primary" data-close>I'll get the next one!</button></div>`;
      });
    }
  }
  if (t >= S.monthStart + MONTH_DAYS * DAY) {
    const got = S.monthCaught;
    S.monthStart = t; S.monthCaught = 0;
    showModal(card => {
      card.innerHTML = `
        <h2 class="center">New month!</h2>
        <div class="big">📅</div>
        <p class="center">Last month you caught <b>${got}</b> of ${GOAL} animals.</p>
        <p class="center">You need ${GOAL} in one month to level up. A new month starts now. You can do it!</p>
        <div class="actions"><button class="btn primary" data-close>Let's go!</button></div>`;
    });
  }
  wildArrivals();
  save(); updateHud();
}

/* ---------- Actions ---------- */
function getTarget() {
  let best = null, bd = 70;
  const consider = (kind, obj, x, y) => { const d = Math.hypot(x - player.x, y - player.y); if (d < bd) { bd = d; best = { kind, obj, x, y }; } };
  animals.forEach(a => consider('animal', a, a.x, a.y));
  TRAINERS.forEach(t => consider('trainer', t, t.x * T + T / 2, t.y * T + T / 2));
  chickens.forEach(c => consider('chicken', c, c.x, c.y));
  consider('store', null, DOOR.x * T + T / 2, (DOOR.y + 1) * T);
  return best;
}
function promptFor(tg) {
  const k = isTouch ? 'Tap' : 'Click / Space';
  if (tg.kind === 'animal') return `Walk into the ${SP[tg.obj.sp].name} to net it!`;
  if (tg.kind === 'trainer') {
    const ready = (S.trainerReady[tg.obj.id] || 0) - now();
    return ready > 0 ? `${tg.obj.name} is resting ${Math.ceil(ready / 1000)}s` : `${k} · Battle ${tg.obj.name}`;
  }
  if (tg.kind === 'chicken') return `${k} · Pet the chicken`;
  return `Walk in to the Store`;
}
function doAction() {
  if (modalOpen || anim) return;
  const tg = getTarget(); if (!tg) return;
  audio();
  actOn(tg.kind, tg.obj);
}
function actOn(kind, obj) {
  if (modalOpen || anim) return;
  audio();
  if (kind === 'animal') return throwNet(obj);
  if (kind === 'trainer') return startBattle(obj);
  if (kind === 'chicken') return petChicken(obj);
  if (kind === 'store') return openStore();
}
function throwNet(a) {
  if (S.netted.length >= MAX_NETTED) return toast(`Your nets are full! Finish a task first (📋 Tasks).`);
  let golden = S.useGold && S.gold > 0;
  if (!golden && S.nets <= 0) {
    if (S.gold > 0) golden = true;
    else return toast('No nets left! Buy more at the Store 🏪');
  }
  if (golden) S.gold--; else S.nets--;
  sfx.throw();
  anim = { a, golden, t: 0, fx: player.x, fy: player.y - 10 };
  updateHud(); save();
}
function finishNet(a, golden) {
  sfx.boing();
  floats.push({ x: a.x, y: a.y - 30, text: 'BOING!', t: 0, color: '#ff7a3d', size: 30 });
  animals = animals.filter(x => x !== a);
  S.wild = S.wild.filter(w => w.uid !== a.uid);
  const sp = SP[a.sp];
  const task = makeTask(sp, golden);
  const item = { id: S.nextId++, sp: sp.id, task, at: now(), golden };
  S.netted.push(item);
  save(); updateHud();
  setTimeout(() => showModal(card => robotCard(card, item)), 450);
}
function robotCard(card, item) {

    <div class="robot"><div class="face">🤖</div><div>

function petChicken(c) {

/* ---------- Battle (timing game) ---------- */
let battle = null;
function startBattle(tr) {
  const wait = (S.trainerReady[tr.id] || 0) - now();
  if (wait > 0) return toast(`${tr.name} is resting. Come back in ${Math.ceil(wait / 1000)} seconds!`);
  const last = S.caught.length ? SP[S.caught[S.caught.length - 1].sp] : null;
  const partner = last ? { e: last.e, name: 'Your ' + last.name } : { e: '🧒', name: 'You' };
  showModal(card => {
    card.innerHTML = `
      <h2 class="center">⚔️ Battle!</h2>
      <p class="center sub">${esc(tr.name)} wants to battle. Press <b>Space</b> or tap <b>Hit!</b> when the marker is in the green.</p>
      <div class="arena">
        <div class="fighter"><div class="e" id="bYou">${partner.e}</div><div><b>${esc(partner.name)}</b></div><div class="hearts" id="hYou"></div></div>
        <div class="vs">VS</div>
        <div class="fighter"><div class="e" id="bThem">${tr.e}</div><div><b>${esc(tr.name)}</b></div><div class="hearts" id="hThem"></div></div>
      </div>
      <div class="tbar"><div class="zone" id="bZone"></div><div class="mark" id="bMark"></div></div>
      <div class="bmsg" id="bMsg">Get ready…</div>
      <div class="actions"><button class="btn primary" id="bHit" style="min-width:160px;font-size:20px">Hit!</button><button class="btn" id="bRun">Run away</button></div>`;
    const zw = Math.max(0.12, 0.3 - tr.lv * 0.04);
    battle = { tr, partner, you: 3, them: 3, pos: 0, dir: 1, speed: 0.75 + tr.lv * 0.22, zw, zs: 0.3 + Math.random() * (0.7 - zw - 0.3), lock: 0.6, over: false, card };
    renderBattle();
    card.querySelector('#bHit').onclick = battleHit;
    card.querySelector('#bRun').onclick = () => { battle = null; closeModal(); };
  });
}
function renderBattle() {
  const b = battle; if (!b) return;
  const c = b.card;
  c.querySelector('#hYou').textContent = '❤️'.repeat(b.you) + '🤍'.repeat(3 - b.you);
  c.querySelector('#hThem').textContent = '❤️'.repeat(b.them) + '🤍'.repeat(3 - b.them);
  const z = c.querySelector('#bZone'); z.style.left = (b.zs * 100) + '%'; z.style.width = (b.zw * 100) + '%';
}
function updateBattle(dt) {
  const b = battle; if (!b || b.over) return;
  if (b.lock > 0) { b.lock -= dt; if (b.lock <= 0) b.card.querySelector('#bMsg').textContent = 'Now!'; }
  b.pos += b.dir * b.speed * dt;
  if (b.pos > 1) { b.pos = 1; b.dir = -1; } if (b.pos < 0) { b.pos = 0; b.dir = 1; }
  b.card.querySelector('#bMark').style.left = (b.pos * 100) + '%';
}
function battleHit() {
  const b = battle; if (!b || b.over || b.lock > 0) return;
  const c = b.card, msg = c.querySelector('#bMsg');
  const hit = b.pos >= b.zs && b.pos <= b.zs + b.zw;
  const el = c.querySelector(hit ? '#bThem' : '#bYou');
  el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 250);
  if (hit) { b.them--; sfx.hit(); msg.textContent = ['Bonk!', 'Nice hit!', 'Pow!'][Math.floor(Math.random() * 3)]; b.zs = Math.random() * (1 - b.zw); }
  else { b.you--; sfx.miss(); msg.textContent = 'Missed! Ouch!'; }
  b.lock = 0.45;
  renderBattle();
  if (b.them <= 0 || b.you <= 0) {
    b.over = true;
    const won = b.them <= 0;
    setTimeout(() => {
      if (won) {
        S.trainerReady[b.tr.id] = now() + 90000;
        S.gems += 2; save();
        sfx.win();
        msg.innerHTML = `You won! +2 💎`;
        addProgress('battles');
      } else {
        sfx.sad();
        msg.innerHTML = `${esc(b.tr.name)} won this time. Try again!`;
      }
      const btns = c.querySelector('.actions');
      btns.innerHTML = `<button class="btn primary" data-close>${won ? 'Yay!' : 'OK'}</button>`;
    }, 350);
  }
}

  time += dt;
  if (!modalOpen && !anim) {
    let dx = 0, dy = 0;
    if (keys.has('left')) dx--; if (keys.has('right')) dx++;
    if (keys.has('up')) dy--; if (keys.has('down')) dy++;
    if (dx || dy) walkTo = null;
    else if (walkTo) {
      if (walkTo.act) {
        const h = walkTo.act, o = h.obj;
        if (h.kind === 'animal' && !animals.includes(o)) walkTo = null;
        else {
          const px = h.kind === 'animal' || h.kind === 'chicken' ? o.x : h.x, py = h.kind === 'animal' || h.kind === 'chicken' ? o.y : h.y;
          if (Math.hypot(px - player.x, py - player.y) < 60) { walkTo = null; actOn(h.kind, o); }
        }
      }
      if (walkTo) {
        let wp = walkTo.path[0] || (walkTo.x !== null ? { x: walkTo.x, y: walkTo.y } : null);
        if (!wp) { const h = walkTo.act; walkTo = null; if (h) actOn(h.kind, h.obj); }
        else {
          const ddx = wp.x - player.x, ddy = wp.y - player.y, dist = Math.hypot(ddx, ddy);
          if (dist < 5) { if (walkTo.path.length) walkTo.path.shift(); else walkTo.x = null; }
          else { dx = ddx / dist; dy = ddy / dist; }
        }
      }
    }
    if (dx || dy) {
      const l = Math.hypot(dx, dy), sp = 175 * dt;
      const ox = player.x, oy = player.y;
      const nx = player.x + dx / l * sp, ny = player.y + dy / l * sp;
      if (passablePx(nx, player.y, player.r)) player.x = nx;
      if (passablePx(player.x, ny, player.r)) player.y = ny;
      if (dx) player.face = Math.sign(dx);
      if (walkTo) { if (Math.hypot(player.x - ox, player.y - oy) < sp * 0.2) { if ((walkTo.stuck += dt) > 0.3) walkTo = null; } else walkTo.stuck = 0; }
    }
    // bump into an animal = throw a net automatically
    const touching = animals.find(a => Math.hypot(a.x - player.x, a.y - player.y) < 38);
    if (touching && touching !== lastBump) { lastBump = touching; walkTo = null; throwNet(touching); }
    else if (!touching) lastBump = null;
    // walk up to the store door = go inside
    const dd = Math.hypot(DOOR.x * T + T / 2 - player.x, (DOOR.y + 1) * T + 6 - player.y);
    if (dd < 30 && !storeBump && !anim && !modalOpen) { storeBump = true; walkTo = null; openStore(); }
    else if (dd > 70) storeBump = false;
    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i];
      if (Math.hypot(g.x - player.x, g.y - player.y) < 30) {
        gems.splice(i, 1); S.gems++; sfx.gem();
        floats.push({ x: g.x, y: g.y - 20, text: '+1 💎', t: 0, color: '#2f9fe8', size: 20 });
        addProgress('gems');
      }
    }
  }
  animals.forEach(a => { if (!anim || anim.a !== a) wander(a, dt, 32, null); });
  chickens.forEach(c => wander(c, dt, 26, COOP));
  gemTimer += dt;
  if (gemTimer > 12 && gems.length < 9) { gemTimer = 0; spawnGem(); }
  floats.forEach(f => f.t += dt); floats = floats.filter(f => f.t < 1.2);
  if (anim) { anim.t += dt; if (anim.t > 0.8) { const a = anim; anim = null; finishNet(a.a, a.golden); } }
  if (battle) updateBattle(dt);
  tick += dt; if (tick > 1) { tick = 0; checkTimers(); }
}
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); draw();
  requestAnimationFrame(loop);
}

/* ---------- Start ---------- */
initEntities();
wildArrivals();
checkTimers();
updateHud();
if (!S.introSeen) {
  showModal(card => {
    card.innerHTML = `
      <h2 class="center">Net Quest</h2>
      <div class="big">🥅🐰</div>
      <p><b>Animals live in the meadow.</b> Walk right into one and your net flies out by itself. <b>BOING!</b></p>
      <div class="robot"><div class="face">🤖</div><div>Then I give you a <b>task</b> and a <b>due date</b>. Finish the task in time and you catch the animal!</div></div>
      <p>Tasks can be finding gems 💎, winning battles ⚔️, getting gem eggs from chickens 🐔, or real-life jobs 🏠 that a grown-up checks in.</p>
      <p><b>Catch ${GOAL} animals in one month to level up!</b> Buy more nets at the Net Store 🏪.</p>
      <p class="sub"><b>To move:</b> click or tap where you want to go, or use the arrow buttons, or the arrow keys / WASD. Click an animal and you'll run over and net it!</p>
      <div class="actions"><button class="btn primary" data-close>Start!</button></div>`;
    S.introSeen = true; save();
  });
}
requestAnimationFrame(loop);
</script>
</body>
